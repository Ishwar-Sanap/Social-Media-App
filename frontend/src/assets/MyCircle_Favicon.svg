<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="#3C3489"/>

  <!-- Outer dashed ring -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#AFA9EC" stroke-width="5" stroke-dasharray="12 8" opacity="0.6"/>
  <!-- Mid ring -->
  <circle cx="128" cy="128" r="60" fill="none" stroke="#9F99E8" stroke-width="4" opacity="0.9"/>
  <!-- Inner circle -->
  <circle cx="128" cy="128" r="30" fill="#534AB7" opacity="0.4"/>
  <circle cx="128" cy="128" r="30" fill="none" stroke="#CECBF6" stroke-width="3"/>

  <!-- 6 people dots on mid ring -->
  <circle cx="128" cy="68" r="10" fill="#CECBF6"/>
  <circle cx="180" cy="98" r="10" fill="#CECBF6"/>
  <circle cx="180" cy="158" r="10" fill="#CECBF6"/>
  <circle cx="128" cy="188" r="10" fill="#CECBF6"/>
  <circle cx="76" cy="158" r="10" fill="#CECBF6"/>
  <circle cx="76" cy="98" r="10" fill="#CECBF6"/>

  <!-- Center MC text -->
  <text x="128" y="136" text-anchor="middle" dominant-baseline="central"
    font-family="Georgia, serif" font-size="22" font-weight="700"
    fill="#EEEDFE">MC</text>
</svg>
